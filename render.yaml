services:
  - type: web
    name: hyper-ocr-service
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y poppler-utils libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev
      pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8765
      - key: PYTHON_VERSION
        value: 3.10.12
    healthCheckPath: /health
    autoDeploy: true
    rootDir: ocr-service
